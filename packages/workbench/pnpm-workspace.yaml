# Native's local database needs the locked SQLite native module.
# https://pnpm.io/10.x/settings#allowbuilds
allowBuilds:
  better-sqlite3@12.11.1: true
patchedDependencies:
  '@agent-native/core@0.176.5': patches/@agent-native__core@0.176.5.patch
  '@agent-native/toolkit@0.19.3': patches/@agent-native__toolkit@0.19.3.patch
# Only Native imports the official session reader. No second CLI executor ships.
packageExtensions:
  '@agent-native/core@0.176.5':
    peerDependencies:
      '@anthropic-ai/claude-agent-sdk': 0.3.288
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-linux-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64'
  - '@anthropic-ai/claude-agent-sdk-win32-x64'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64'
# officeparser 7.8.0 pins pdfjs-dist 6.1.200 exactly. 6.2.108 fixes GHSA-hq66-cqwq-w95j.
# Drop this override when an officeparser release accepts a fixed PDF.js.
overrides:
  officeparser@7.8.0>pdfjs-dist: 6.2.108
