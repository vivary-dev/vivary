[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vivary-core"
version = "0.2.0"
description = "Vivary's governed-context seam for deterministic evidence, task capsules, receipts, and Strato, Ozone, Exo, and Bellamente policy surfaces."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Kazzee" }]
keywords = ["agents", "provenance", "evidence", "context", "vivary"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://vivary.vercel.app/"
Repository = "https://github.com/vivary-dev/vivary"
Issues = "https://github.com/vivary-dev/vivary/issues"
Changelog = "https://github.com/vivary-dev/vivary/blob/dev/CHANGELOG.md"

[tool.setuptools]
packages = ["vivary_core"]
