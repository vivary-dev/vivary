[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vivary-strato"
version = "0.1.0"
description = "The policy layer: governed loop decisions, budgets, and human gates over Vivary task capsules."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Kazzee" }]
keywords = ["agents", "policy", "governance", "human-in-the-loop", "budgets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["vivary-core>=0.2.1"]

[project.urls]
Homepage = "https://vivary.vercel.app/"
Documentation = "https://vivary.vercel.app/"
Repository = "https://github.com/vivary-dev/vivary"
Issues = "https://github.com/vivary-dev/vivary/issues"
Changelog = "https://github.com/vivary-dev/vivary/blob/dev/CHANGELOG.md"

[project.scripts]
strato = "strato:main"

[tool.setuptools]
py-modules = ["strato"]

[tool.pytest.ini_options]
testpaths = ["tests"]
