[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vivary"
version = "0.2.0"
description = "Local-first governed context for agent work. One install for the Vivary CLI suite: create-vivary, tropo, strato, ozone, and exo."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jeff Kazzee" }]
keywords = ["agents", "workspace", "knowledge-graph", "scaffold", "vivary"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "create-vivary>=0.4.2",
    "vivary-tropo>=0.5.3",
    "vivary-strato>=0.1.2",
    "vivary-ozone>=0.3.1",
    "vivary-exo>=0.3.0",
]

[project.scripts]
vivary = "vivary_cli:main"

[project.urls]
Homepage = "https://vivary.vercel.app/"
Repository = "https://github.com/vivary-dev/vivary"
Changelog = "https://github.com/vivary-dev/vivary/blob/dev/CHANGELOG.md"

[tool.setuptools]
py-modules = ["vivary_cli"]
