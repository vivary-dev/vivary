[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "create-vivary"
version = "0.4.1"
description = "Create a lightweight local-first governed-context workspace with evidence, receipts, verification, and human gates."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Kazzee" }]
keywords = ["agents", "workspace", "scaffold", "knowledge-graph", "create-app"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["vivary-tropo>=0.5.3"]

[project.urls]
Homepage = "https://vivary.vercel.app/"
Documentation = "https://vivary.vercel.app/"
Repository = "https://github.com/vivary-dev/vivary"
Issues = "https://github.com/vivary-dev/vivary/issues"
Changelog = "https://github.com/vivary-dev/vivary/blob/dev/CHANGELOG.md"

[project.scripts]
create-vivary = "create_vivary:main"

[tool.setuptools]
py-modules = ["create_vivary"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
