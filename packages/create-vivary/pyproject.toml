[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "create-vivary"
version = "0.1.0"
description = "Scaffold a complete Vivary agent workspace — the create-t3-app for agent-native workspaces."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jeff Kazzee" }]
keywords = ["agents", "workspace", "scaffold", "knowledge-graph", "create-app"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["vivary-tropo>=0.1.0"]

[project.urls]
Homepage = "https://github.com/vivary-dev/vivary"
Repository = "https://github.com/vivary-dev/vivary"

[project.scripts]
create-vivary = "create_vivary:main"

[tool.setuptools]
py-modules = ["create_vivary"]
packages = ["create_vivary_assets"]

[tool.setuptools.package-data]
create_vivary_assets = ["*.md", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
