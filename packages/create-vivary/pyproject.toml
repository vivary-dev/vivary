[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "create-vivary"
version = "0.2.5"
description = "Scaffold a complete Vivary agent workspace — the create-t3-app for agent-native workspaces."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Kazzee" }]
keywords = ["agents", "workspace", "scaffold", "knowledge-graph", "create-app"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["vivary-tropo>=0.2.3"]

[project.urls]
Homepage = "https://vivary.vercel.app/"
Documentation = "https://vivary.vercel.app/"
Repository = "https://github.com/vivary-dev/vivary"
Issues = "https://github.com/vivary-dev/vivary/issues"
Changelog = "https://github.com/vivary-dev/vivary/blob/dev/CHANGELOG.md"

[project.scripts]
create-vivary = "create_vivary:main"

[tool.setuptools]
py-modules = ["create_vivary"]
packages = ["create_vivary_assets"]

[tool.setuptools.package-data]
create_vivary_assets = ["*.md", "**/*.md", "templates/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
