[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vivary-ozone"
version = "0.1.0"
description = "The review layer: graph-aware review and blast-radius impact over a tropo knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jeff Kazzee" }]
keywords = ["review", "knowledge-graph", "agents", "blast-radius", "gate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["vivary-tropo>=0.1.0"]

[project.urls]
Homepage = "https://github.com/vivary-dev/vivary"
Repository = "https://github.com/vivary-dev/vivary"

[project.scripts]
ozone = "ozone:main"

[tool.setuptools]
py-modules = ["ozone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
