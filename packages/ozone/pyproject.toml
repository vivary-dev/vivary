[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vivary-ozone"
version = "0.3.0"
description = "The review layer: graph-aware review, impact analysis, and governed evidence verification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Kazzee" }]
keywords = ["review", "knowledge-graph", "agents", "blast-radius", "gate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["vivary-core>=0.2.2", "vivary-tropo>=0.3.0"]

[project.urls]
Homepage = "https://vivary.vercel.app/"
Documentation = "https://vivary.vercel.app/"
Repository = "https://github.com/vivary-dev/vivary"
Issues = "https://github.com/vivary-dev/vivary/issues"
Changelog = "https://github.com/vivary-dev/vivary/blob/dev/CHANGELOG.md"

[project.scripts]
ozone = "ozone:main"

[tool.setuptools]
py-modules = ["ozone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
