[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vivary-exo"
version = "0.1.0"
description = "The coordination layer: graph-aware conflict detection and role contracts over a tropo knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Kazzee" }]
keywords = ["orchestration", "multi-agent", "knowledge-graph", "coordination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["vivary-tropo>=0.1.0"]

[project.urls]
Homepage = "https://vivary.vercel.app/"
Documentation = "https://vivary.vercel.app/"
Repository = "https://github.com/vivary-dev/vivary"
Issues = "https://github.com/vivary-dev/vivary/issues"
Changelog = "https://github.com/vivary-dev/vivary/blob/dev/CHANGELOG.md"

[project.scripts]
exo = "exo:main"

[tool.setuptools]
py-modules = ["exo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
