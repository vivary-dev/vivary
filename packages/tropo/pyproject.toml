[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vivary-tropo"
version = "0.2.0"
description = "The filesystem is the schema: a folder-as-type typed-knowledge layer for Markdown."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Kazzee" }]
keywords = ["markdown", "frontmatter", "knowledge-base", "second-brain", "typechecker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.optional-dependencies]
embedded = ["lancedb>=0.14.0"]
cloud    = ["qdrant-client>=2.12.0"]
astra    = ["astrapy>=1.3.0"]

[project.urls]
Homepage = "https://vivary.vercel.app/"
Documentation = "https://vivary.vercel.app/"
Repository = "https://github.com/vivary-dev/vivary"
Issues = "https://github.com/vivary-dev/vivary/issues"
Changelog = "https://github.com/vivary-dev/vivary/blob/dev/CHANGELOG.md"

[project.scripts]
tropo = "tropo:main"

[tool.setuptools]
py-modules = ["tropo"]
# NOTE: bundled starter packs (packs/*.toml) are a repo convenience and are not
# included in the wheel. Per-vault packs in `.tropo/packs/` are still resolved.

[tool.pytest.ini_options]
testpaths = ["tests"]
