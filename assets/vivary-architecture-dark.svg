<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
<title id="t">Vivary architecture</title><desc id="d">The Electron window connects to the Workbench server on loopback. The server reaches project folders, a bundled Python engine and the Agent-Native layer, which drives Claude Code or Codex. A browser client on another device connects through remote access, which is not yet accepted.</desc>
