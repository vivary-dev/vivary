<rect x="44" y="58" width="190" height="78" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="139" y="85" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Vivary window</text>
<text x="139" y="103" font-size="12.5" fill="#9198a1" text-anchor="middle">Electron, sandboxed</text>
<text x="139" y="121" font-size="12.5" fill="#9198a1" text-anchor="middle">no Node in the renderer</text>
<rect x="285" y="58" width="190" height="78" rx="10" fill="#161b22" stroke="#b5ef4a" stroke-width="2"/>
<text x="380" y="85" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Workbench host</text>
<text x="380" y="103" font-size="12.5" fill="#9198a1" text-anchor="middle">local server on loopback</text>
<text x="380" y="121" font-size="12.5" fill="#9198a1" text-anchor="middle">shared workspace UI</text>
<rect x="526" y="58" width="190" height="78" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="621" y="85" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Project registry</text>
<text x="621" y="103" font-size="12.5" fill="#9198a1" text-anchor="middle">folder binding</text>
<text x="621" y="121" font-size="12.5" fill="#9198a1" text-anchor="middle">and authorization</text>
<rect x="285" y="200" width="190" height="78" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="380" y="227" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Agent-Native</text>
<text x="380" y="245" font-size="12.5" fill="#9198a1" text-anchor="middle">conversations, runs,</text>
<text x="380" y="263" font-size="12.5" fill="#9198a1" text-anchor="middle">approvals, activity</text>
<rect x="526" y="200" width="190" height="78" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="621" y="227" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Engine bridge</text>
<text x="621" y="245" font-size="12.5" fill="#9198a1" text-anchor="middle">bounded commands</text>
<text x="621" y="263" font-size="12.5" fill="#9198a1" text-anchor="middle">on bundled Python</text>
<rect x="44" y="200" width="190" height="78" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="139" y="227" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Application data</text>
<text x="139" y="245" font-size="12.5" fill="#9198a1" text-anchor="middle">database, transcripts,</text>
<text x="139" y="263" font-size="12.5" fill="#9198a1" text-anchor="middle">run records</text>
<rect x="285" y="348" width="190" height="78" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="380" y="375" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Coding runtime</text>
<text x="380" y="393" font-size="12.5" fill="#9198a1" text-anchor="middle">Claude Code or Codex</text>
<text x="380" y="411" font-size="12.5" fill="#9198a1" text-anchor="middle">installed separately</text>
<rect x="526" y="348" width="190" height="78" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="621" y="375" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Project folders</text>
<text x="621" y="393" font-size="12.5" fill="#9198a1" text-anchor="middle">your files, instructions</text>
<text x="621" y="411" font-size="12.5" fill="#9198a1" text-anchor="middle">and saved facts</text>
<rect x="770" y="348" width="170" height="78" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="855" y="375" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Model provider</text>
<text x="855" y="393" font-size="12.5" fill="#9198a1" text-anchor="middle">your own account</text>
<text x="855" y="411" font-size="12.5" fill="#9198a1" text-anchor="middle">with the runtime</text>
<rect x="770" y="58" width="170" height="78" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="855" y="85" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Browser client</text>
<text x="855" y="103" font-size="12.5" fill="#9198a1" text-anchor="middle">remote access,</text>
<text x="855" y="121" font-size="12.5" fill="#9198a1" text-anchor="middle">not yet accepted</text>
