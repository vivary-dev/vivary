name: publish-blog

on:
  schedule:
    - cron: '7 15 * * 1,3,5' # Mon/Wed/Fri 15:07 UTC
  workflow_dispatch:        # Also runnable manually

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-due-drafts:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2 pinned to an immutable commit SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: flip due drafts
        id: flip
        run: |
          python3 - <<'PY'
          import re
          from datetime import date
          from pathlib import Path

          today = date.today()
          flipped = []
          for post in sorted(Path("site/src/content/blog").glob("*.md")):
              text = post.read_text(encoding="utf-8")
              head = text.split("---", 2)[1] if text.startswith("---") else ""
              if not re.search(r"^draft:\s*true\s*$", head, re.M):
                  continue
              m = re.search(r"^date:\s*(\d{4})-(\d{2})-(\d{2})\s*$", head, re.M)
              if not m:
                  continue
              if date(int(m[1]), int(m[2]), int(m[3])) > today:
                  continue
              new_head = re.sub(r"^draft:\s*true\s*$", "draft: false", head, flags=re.M)
              post.write_text(text.replace(head, new_head, 1), encoding="utf-8")
              flipped.append(post.name)
          Path("flipped.txt").write_text("\n".join(flipped), encoding="utf-8")
          print("flipped:", flipped or "nothing due")
          PY

      - name: open publish PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FLIPPED=$(cat flipped.txt)
          rm -f flipped.txt
          git add site/src/content/blog/
          if git diff --staged --quiet; then
            echo "no posts due"
          else
            DATE=$(date -u +%Y-%m-%d)
            BRANCH="content/publish-$DATE"
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              BRANCH="content/publish-$DATE-${GITHUB_RUN_ID}"
            fi
            git switch -c "$BRANCH"
            git commit -m "content: publish due blog posts ($DATE)"
            gh auth setup-git
            git push --set-upstream origin "$BRANCH"
            gh pr create \
              --base dev \
              --head "$BRANCH" \
              --title "content: publish due blog posts ($DATE)" \
              --body "Scheduled publish of drafts whose date has arrived:"$'\n\n'"$FLIPPED"
            gh pr merge "$BRANCH" --auto --merge \
              || echo "auto-merge unavailable; PR left open for manual merge"
          fi
