  workbench:
    name: workbench tests
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *runner_action_node_bootstrap
      - name: require changed-path and dispatch validation
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: actual pip runtime admission
        shell: python -I -B {0}
        run: |
          import runpy
          runpy.run_path("scripts/check_pip_runtime.py", run_name="__main__")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: actual Node security admission
        run: node packages/workbench/bin/runtime-security.mjs
      - name: Node runtime policy and boundary tests
        run: node --test packages/workbench/tests/runtime-security.test.mjs
      - name: install workbench dependencies
        run: |
          npm install --global pnpm@10.33.2
          pnpm --dir packages/workbench install --frozen-lockfile
      - name: workbench state transport
        run: |
          pnpm --dir packages/workbench exec tsx --test tests/local-access.test.ts tests/owner-sign-in.test.ts tests/native-state.test.ts tests/native-actions.test.ts tests/desktop-host.test.ts tests/chat-scope.test.ts tests/native-chat-project.test.ts
          pnpm --dir packages/workbench exec tsx --test --test-concurrency=1 tests/local-code-agent.test.ts tests/linked-history.test.ts tests/linked-conversations.test.ts tests/linked-conversation-components.test.mjs tests/claude-session-continuity.test.mjs tests/code-session-details.test.ts tests/code-state-snapshot.test.mjs tests/codex-models.test.ts tests/codex-executor.test.mjs tests/codex-app-server.test.ts tests/codex-transcript.test.mjs tests/codex-active-state.test.mjs tests/core-message-parent.test.mjs tests/local-root-provider.test.mjs tests/native-registry-scope.test.mjs tests/codex-approval.test.ts tests/code-execution-host.test.ts tests/local-runtime-setup.test.ts tests/local-code-approval-restart.test.ts tests/local-code-cleanup-refusal.test.ts tests/code-host-lifecycle.test.ts tests/desktop-server-shutdown.test.mjs tests/managed-projects.test.mjs tests/project-creation-shutdown.test.mjs tests/managed-project-reconnection.test.mjs tests/creator-runner.test.ts tests/creator-shutdown.test.mjs tests/python-bytecode.test.mjs tests/project-files.test.ts tests/project-memory.test.ts tests/file-draft-state.test.ts tests/original-runtime.test.ts tests/original-runtime-shutdown.test.ts tests/original-runtime-control-shutdown.test.ts tests/project-search.test.ts tests/project-file-location.test.ts tests/project-search-state.test.ts tests/project-read.test.ts tests/project-evaluate.test.ts tests/project-evaluate-form.test.ts tests/documentation-links.test.mjs tests/project-adoption.test.ts tests/project-adoption-service.test.mjs tests/project-preview.test.ts tests/preview-isolation.test.ts tests/local-registry-model.test.mjs tests/workspace-kind-dialog-component.test.mjs tests/sidebar-mark-component.test.mjs
          node --test packages/desktop/tests/main.test.mjs packages/desktop/tests/original-runtime.test.mjs packages/desktop/tests/package-snapshot.test.mjs packages/desktop/tests/installer-script.test.mjs packages/desktop/tests/installer-build.test.mjs packages/workbench/tests/startup.test.mjs
          python packages/workbench/tests/managed-projects-python.test.py
          pnpm --dir packages/workbench typecheck
          pnpm --dir packages/workbench run doctor

  workbench-maintained:
    name: maintained workbench checks
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *runner_action_node_bootstrap
      - name: require changed-path and dispatch validation
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: actual Node security admission
        run: node packages/workbench/bin/runtime-security.mjs
      - name: install workbench dependencies
        run: |
          npm install --global pnpm@10.33.2
          pnpm --dir packages/workbench install --frozen-lockfile
      - name: automation lifecycle regression batch
        run: node --test packages/workbench/tests/usage-metrics-cold-start.test.mjs packages/workbench/tests/native-thread-save.test.mjs packages/workbench/tests/native-thread-fold.test.mjs packages/workbench/tests/native-thread-save-queue.test.mjs packages/workbench/tests/native-thread-save-store.test.mjs packages/workbench/tests/native-engine-packages.test.mjs packages/workbench/tests/chat-model-groups.test.mjs packages/workbench/tests/replay-tool-call-ids.test.mjs packages/workbench/tests/automation-run-now.test.mjs packages/workbench/tests/automation-local-only.test.mjs packages/workbench/tests/automation-approval.test.mjs packages/workbench/tests/automation-approval-owner-scope.test.mjs packages/workbench/tests/cli-bridge-arguments.test.mjs packages/workbench/tests/sql-inspection.test.mjs packages/workbench/tests/sql-postgres-inspection.test.mjs packages/workbench/tests/automation-webhook.test.mjs packages/workbench/tests/automation-event-condition.test.mjs packages/workbench/tests/automation-event-loop.test.mjs packages/workbench/tests/automation-status.test.mjs packages/workbench/tests/automation-quit.test.mjs packages/workbench/tests/automation-file-review.test.mjs packages/workbench/tests/automation-file-review-component.test.mjs packages/workbench/tests/builder-offers.test.mjs packages/workbench/tests/builder-offers-component.test.mjs packages/workbench/tests/code-run-control-cleanup-component.test.mjs packages/workbench/tests/mcp-settings-component.test.mjs packages/workbench/tests/dependency-advisories.test.mjs packages/workbench/tests/pdf-ingestion.test.mjs packages/workbench/tests/xlsx-codepages.test.mjs packages/workbench/tests/markdown-reader.test.mjs
      - name: maintained workbench checks
        run: pnpm --dir packages/workbench test:maintained

  governed-platform-proof:
    name: governed verification (Windows)
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - *runner_action_node_bootstrap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: actual pip runtime admission
        shell: python -I -B {0}
        run: |
          import runpy
          runpy.run_path("scripts/check_pip_runtime.py", run_name="__main__")
      - name: source navigation contract on Windows
        run: python -B scripts/check-source-navigation.py --check
      - name: source navigation contract tests on Windows
        run: python -B scripts/tests/test-source-navigation.py
      - name: install test runner
        run: python -I -m pip install pytest packaging
      - name: preview owner startup cancellation on Windows
        run: python -m pytest packages/workbench/tests/test_windows_preview_owner.py -q
      - name: thin init CLI on Windows
        run: python packages/create-vivary/tests/test_init_thin.py
      - name: reviewed workspace creation on Windows
        run: python packages/create-vivary/tests/test_thin_init_preview.py
      - name: managed project bridge on Windows
        run: python packages/workbench/tests/managed-projects-python.test.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: actual Node security admission
        run: node packages/workbench/bin/runtime-security.mjs
      - name: install workbench dependencies
        shell: pwsh
        run: |
          npm install --global pnpm@10.33.2
          if ($LASTEXITCODE -ne 0) { throw "pnpm install failed" }
          pnpm --dir packages/workbench install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "workbench dependency install failed" }
      - name: desktop and creator shutdown and bytecode cache on Windows
        run: pnpm --dir packages/workbench exec tsx --test tests/desktop-server-shutdown.test.mjs tests/creator-shutdown.test.mjs tests/python-bytecode.test.mjs
      - name: core governed-context contract
        run: python -m pytest packages/core/tests/ -q
      - name: ozone governed-verification facade
        run: python packages/ozone/tests/test_ozone.py
      - name: strato governed-policy consumer
        run: python -m pytest packages/strato/tests/ -q
      - name: installed-wheel capability surface
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "vivary-wheel-$([guid]::NewGuid())"
          $wheelhouse = Join-Path $smoke "wheels"
          New-Item -ItemType Directory -Path $wheelhouse -Force | Out-Null
          python -I -m pip wheel --no-deps --wheel-dir $wheelhouse `
            ./packages/core `
            ./packages/tropo `
            ./packages/strato `
            ./packages/ozone `
            ./packages/exo `
            ./packages/create-vivary `
            ./packages/vivary `
            ./packages/memory-cognee `
            ./packages/mcp
          if ($LASTEXITCODE -ne 0) { throw "wheel build failed" }
          python -m venv (Join-Path $smoke "venv")
          if ($LASTEXITCODE -ne 0) { throw "venv creation failed" }
          $scripts = Join-Path $smoke "venv\Scripts"
          $python = Join-Path $scripts "python.exe"
          & $python -I -m pip install --no-index --find-links $wheelhouse vivary
          if ($LASTEXITCODE -ne 0) { throw "vivary install failed" }
          & $python -I -m pip check
          if ($LASTEXITCODE -ne 0) { throw "pip check failed" }
          & $python -I scripts/check_installed_workspace_roles.py
          if ($LASTEXITCODE -ne 0) { throw "installed role API failed" }
          $capabilityJson = & (Join-Path $scripts "create-vivary.exe") `
            capabilities --preset coding --json
          if ($LASTEXITCODE -ne 0) { throw "capability report failed" }
          $report = $capabilityJson | ConvertFrom-Json
          $governed = @(
            $report.available_capabilities |
              Where-Object { $_.id.StartsWith("governed-") }
          )
          $invalid = @(
            $governed |
              Where-Object {
                -not $_.installed -or $_.install_status -ne "installed"
              }
          )
          if ($governed.Count -ne 5 -or $invalid.Count -ne 0) {
            throw "governed capability surface is incomplete"
          }
          & $python -c "import vivary_core, tropo, strato, ozone, exo"
          if ($LASTEXITCODE -ne 0) { throw "governed package import failed" }
          foreach ($command in @(
            "create-vivary", "vivary", "tropo", "strato", "ozone", "exo"
          )) {
            & (Join-Path $scripts "$command.exe") --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$command entrypoint failed" }
          }
          $vivary = Join-Path $scripts "vivary.exe"
          & $vivary --version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "vivary version failed" }
          & $vivary check --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "vivary check help failed" }
          $routedCapabilities = & $vivary capabilities --preset coding --json
          if ($LASTEXITCODE -ne 0) { throw "vivary capabilities failed" }
          if (-not ($routedCapabilities | ConvertFrom-Json).available_capabilities) {
            throw "routed capabilities reported no capability rows"
          }
          python scripts/check_installed_route_parity.py $scripts
          if ($LASTEXITCODE -ne 0) { throw "installed route parity failed" }
          python scripts/check_installed_route_parity.py --characterize $scripts
          if ($LASTEXITCODE -ne 0) { throw "installed command surface failed" }
          $mcpVenv = Join-Path $smoke "mcp-venv"
          python -m venv $mcpVenv
          if ($LASTEXITCODE -ne 0) { throw "MCP venv creation failed" }
          $mcpScripts = Join-Path $mcpVenv "Scripts"
          $mcpPython = Join-Path $mcpScripts "python.exe"
          & $mcpPython -I -B scripts/check_pip_runtime.py
          if ($LASTEXITCODE -ne 0) { throw "MCP pip runtime admission failed" }
          & $mcpPython -I -m pip install "mcp==2.2.0"
          if ($LASTEXITCODE -ne 0) { throw "MCP dependency install failed" }
          & $mcpPython -I -m pip install --no-index --find-links $wheelhouse vivary-mcp create-vivary
          if ($LASTEXITCODE -ne 0) { throw "optional MCP install failed" }
          & $mcpPython -I -m pip check
          if ($LASTEXITCODE -ne 0) { throw "optional MCP pip check failed" }
          & (Join-Path $mcpScripts "vivary-mcp.exe") --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "vivary-mcp entrypoint failed" }
          @'
          from importlib.metadata import PackageNotFoundError, requires, version
          import create_vivary

          assert version("vivary-mcp") == "0.1.4"
          assert version("vivary-tropo") == "0.5.5"
          assert version("vivary-core") == "0.2.7"
          assert version("mcp") == "2.2.0"
          assert version("mcp-types") == "2.2.0"
          mcp_requirements = requires("vivary-mcp") or []
          assert "vivary-tropo>=0.5.3" in mcp_requirements
          assert "mcp==2.2.0" in mcp_requirements
          assert not any(
              requirement.startswith("vivary-core")
              for requirement in mcp_requirements
          )
          report = create_vivary.capability_report("coding")
          interop = next(
              row
              for row in report["available_capabilities"]
              if row["id"] == "interop:mcp"
          )
          assert interop["installed"] is True
          assert interop["install_status"] == "installed"
          assert interop["sdk_version"] == "2.2.0"
          assert interop["conformance_status"] == "unproven"
          try:
              version("vivary")
          except PackageNotFoundError:
              pass
          else:
              raise AssertionError("optional MCP install pulled the vivary meta-package")
          '@ | & $mcpPython -
          if ($LASTEXITCODE -ne 0) { throw "optional MCP identity proof failed" }

  orientation-proof:
    name: orientation proof (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - *runner_action_node_bootstrap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: actual pip runtime admission
        shell: python -I -B {0}
        run: |
          import runpy
          runpy.run_path("scripts/check_pip_runtime.py", run_name="__main__")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: actual Node security admission
        run: node packages/workbench/bin/runtime-security.mjs
      - name: install pinned uv runner
        env:
          PIP_CONFIG_FILE: ${{ runner.os == 'Windows' && 'nul' || '/dev/null' }}
        run: |
          python -I -m pip --isolated install --force-reinstall --no-deps --only-binary=:all: "${{ runner.os == 'Linux' && 'https://files.pythonhosted.org/packages/3a/ad/3c2a81d66d1839063662e5b6c0002ec31f8ee987dbc5295747627ca6160a/uv-0.13.5-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=fa8d26e08e34c29c0c4e820cf3181757086d547240b4f4d31ff1d8bd810ca946' || runner.os == 'Windows' && 'https://files.pythonhosted.org/packages/32/ea/771744a784b16aa21d195cb5d5d5a2878d72fa00fc26f11ea3f9646994fe/uv-0.13.5-py3-none-win_amd64.whl#sha256=1fb29fc46ba12033e2ef95a95ac79d649e71bbb1358419bbbcbd19d86026ef2f' || '' }}"
      - name: actual uv runtime admission
        run: python -I -B scripts/check_uv_runtime.py
      - name: governed context adapter (Windows path contract)
        if: runner.os == 'Windows'
        run: python packages/tropo/tests/test_tropo.py
      - name: thin workspace lifecycle (${{ matrix.os }})
        run: |
          python packages/create-vivary/tests/test_init_thin.py
          python packages/create-vivary/tests/test_record_workflow.py
          python packages/create-vivary/tests/test_adopt.py
      - name: actual uv runtime admission
        run: python -I -B scripts/check_uv_runtime.py
      - name: run disposable orientation proof
        run: python packages/create-vivary/tests/orientation_proof.py --receipt orientation-proof.json
      - name: preserve orientation receipt
        if: ${{ !cancelled() && steps.runner_action_node.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orientation-proof-${{ runner.os }}
          path: orientation-proof.json
          if-no-files-found: error

  review:
    name: graph review gate
    needs: changes
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *runner_action_node_bootstrap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: mkdir -p sandboxes
      - name: scaffold a workspace
        run: python packages/create-vivary/create_vivary.py init sandboxes/ci-ws --preset coding --force --no-wizard
      - name: doctor
        run: python packages/create-vivary/create_vivary.py doctor sandboxes/ci-ws
      - name: tropo check (strict)
        run: python packages/tropo/tropo.py check --root sandboxes/ci-ws
      - name: ozone review (gate)
        run: python packages/ozone/ozone.py review --root sandboxes/ci-ws --strict

  site:
    name: site build
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *runner_action_node_bootstrap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: actual Node security admission
        run: node packages/workbench/bin/runtime-security.mjs
      - name: install
        run: npm ci
        working-directory: site
      - name: audit high and critical site dependencies
        run: npm audit --audit-level=high
        working-directory: site
      - name: site behavior and information architecture tests
        run: npm run test:site
        working-directory: site
      - name: build (re-syncs docs, then astro build)
        run: npm run build
        working-directory: site
      - name: verify generated docs are committed
        run: |
          git diff --exit-code -- \
            site/src/content/docs \
            site/public/llms.txt \
            site/public/llms-full.txt
          untracked="$(git ls-files --others --exclude-standard -- \
            site/src/content/docs \
            site/public/llms.txt \
            site/public/llms-full.txt)"
          if [ -n "$untracked" ]; then
            echo "Generated documentation contains untracked files:"
            printf '%s\n' "$untracked"
            exit 1
          fi
      - name: check built links and anchors
        run: npm run test:links
        working-directory: site
