name: ci

# GitHub Actions is free for public repos, so this runs at no cost.
on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    name: tests + checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: mkdir -p sandboxes
      - name: tropo
        run: python packages/tropo/tests/test_tropo.py
      - name: ozone
        run: python packages/ozone/tests/test_ozone.py
      - name: exo
        run: python packages/exo/tests/test_exo.py
      - name: create-vivary
        run: python packages/create-vivary/tests/test_create_vivary.py
      - name: create-vivary adopt
        run: python packages/create-vivary/tests/test_adopt.py
      - name: create-vivary orientation proof regressions
        run: python packages/create-vivary/tests/test_orientation_proof.py
      - name: create-vivary privacy (differential vs real git check-ignore)
        run: python packages/create-vivary/tests/test_privacy_differential.py
      - name: strato integrity (scaffold smokes, link/parity checks)
        run: python packages/create-vivary/tests/test_strato_integrity.py
      - name: memory-cognee
        run: python packages/memory-cognee/tests/test_memory_cognee.py
      - name: vivary meta CLI
        run: python packages/vivary/tests/test_vivary_cli.py
      - name: core (governed-context seam; suite is the ported reference tests)
        run: |
          python -m pip install pytest
          python -m pytest packages/core/tests/ -q
      - name: packaged core and optional semantic bridge smoke
        shell: bash
        run: |
          python -m pip install --no-deps ./packages/core ./packages/tropo ./packages/memory-cognee
          smoke="$(mktemp -d)"
          mkdir -p "$smoke/ws/.vivary" "$smoke/ws/modules/auth"
          cat > "$smoke/ws/tropo.toml" <<'EOF'
          packs = ["repo-graph"]
          EOF
          cat > "$smoke/ws/.gitignore" <<'EOF'
          .vivary/memory/
          USER.md
          MEMORY.md
          EOF
          cat > "$smoke/ws/.vivary/memory.toml" <<'EOF'
          [memory]
          enabled = true
          mode = "semantic-provider"
          provider = "cognee"

          [memory.cognee]
          state_path = ".vivary/memory/cognee"
          allow_network = false
          allow_without_api_key = true
          EOF
          cat > "$smoke/ws/modules/auth/index.md" <<'EOF'
          ---
          project: smoke
          status: active
          ---
          # Auth

          Authentication module.
          EOF
          git -C "$smoke/ws" init -q
          git -C "$smoke/ws" add .
          git -C "$smoke/ws" \
            -c user.name="Vivary CI" \
            -c user.email="ci@vivary.invalid" \
            commit -qm "smoke fixture"
          tropo find "authentication module" \
            --root "$smoke/ws" \
            --governed \
            --max-claims 2 \
            --json > "$smoke/governed.json"
          set +e
          tropo query "auth" --root "$smoke/ws" --mode semantic --json > "$smoke/out.json"
          rc=$?
          set -e
          python - "$smoke/out.json" "$smoke/governed.json" "$rc" <<'PY'
          import json
          import sys
          from importlib.metadata import requires, version
          import tomllib

          data = json.loads(open(sys.argv[1], encoding="utf-8").read())
          governed = json.loads(open(sys.argv[2], encoding="utf-8").read())
          with open("packages/core/pyproject.toml", "rb") as stream:
              core_version = tomllib.load(stream)["project"]["version"]
          with open("packages/tropo/pyproject.toml", "rb") as stream:
              tropo_dependencies = tomllib.load(stream)["project"]["dependencies"]
          core_requirement = next(
              dependency
              for dependency in tropo_dependencies
              if dependency.startswith("vivary-core")
          )
          rc = int(sys.argv[3])
          assert rc == 1, rc
          assert data["mode"] == "semantic"
          assert data["semantic"]["provider"] == "cognee"
          assert data["semantic"]["status"] == "unavailable"
          assert "allow_network" in data["semantic"]["detail"]
          assert data["results"] == []
          assert version("vivary-core") == core_version
          assert core_requirement in (requires("vivary-tropo") or [])
          assert governed["schema"] == "vivary.task-capsule/v0"
          assert governed["budget"] == {"max_claims": 2}
          assert governed["claims"]
          PY
      - name: assets parity
        run: python packages/create-vivary/tests/test_assets_parity.py
      - name: npm launcher
        run: node packages/create-vivary/tests/test_npm_launcher.js
      - name: npm trusted publish workflow guard
        run: python scripts/check_npm_trusted_publish_workflow.py
      - name: package docs parity guard tests
        run: python scripts/tests/test_package_docs_parity.py
      - name: package docs parity (documented PyPI list vs manifests)
        run: python scripts/check_package_docs_parity.py
      - name: tropo check (example vault, strict)
        run: python packages/tropo/tropo.py check --root packages/tropo/examples/vault
      - name: line endings
        run: python scripts/check_line_endings.py
      - name: diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA...HEAD"

  orientation-proof:
    name: orientation proof (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: install pinned uv runner
        run: python -m pip install uv==0.11.21
      - name: run disposable orientation proof
        run: python packages/create-vivary/tests/orientation_proof.py --receipt orientation-proof.json
      - name: preserve orientation receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: orientation-proof-${{ runner.os }}
          path: orientation-proof.json
          if-no-files-found: error

  review:
    name: graph review gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: mkdir -p sandboxes
      - name: scaffold a workspace
        run: python packages/create-vivary/create_vivary.py init sandboxes/ci-ws --preset coding --force --no-wizard
      - name: doctor
        run: python packages/create-vivary/create_vivary.py doctor sandboxes/ci-ws
      - name: tropo check (strict)
        run: python packages/tropo/tropo.py check --root sandboxes/ci-ws
      - name: ozone review (gate)
        run: python packages/ozone/ozone.py review --root sandboxes/ci-ws --strict

  site:
    name: site build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: install
        run: npm ci
        working-directory: site
      - name: site behavior and information architecture tests
        run: npm run test:site
        working-directory: site
      - name: build (re-syncs docs, then astro build)
        run: npm run build
        working-directory: site
      - name: check built links and anchors
        run: npm run test:links
        working-directory: site
