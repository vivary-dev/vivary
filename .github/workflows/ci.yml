  workbench:
    name: workbench tests
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *runner_action_node_bootstrap
      - name: require changed-path and dispatch validation
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.15"
      - name: verified Python runtime provisioning
        shell: python -I -B {0}
        run: |
          import runpy
          runpy.run_path("scripts/bootstrap_ci_python.py", run_name="__main__")
      - name: actual Python runtime admission
        shell: python -I -B {0}
        run: |
          import runpy
          runpy.run_path("scripts/check_python_runtime.py", run_name="__main__")
      - name: verified pip runtime provisioning
        shell: python -I -B {0}
        run: |
          import runpy
          runpy.run_path("scripts/bootstrap_ci_pip.py", run_name="__main__")
      - name: actual pip runtime admission
        shell: python -I -B {0}
        run: |
          import runpy
          runpy.run_path("scripts/check_pip_runtime.py", run_name="__main__")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
      - name: actual Node security admission
        run: node packages/workbench/bin/runtime-security.mjs
      - name: Node runtime policy and boundary tests
        run: node --test packages/workbench/tests/runtime-security.test.mjs
      - name: qualified workbench build tools
        shell: bash
        run: |
          python -I -B scripts/bootstrap_build_tools.py --root "$RUNNER_TEMP/vivary-build-tools" || exit $?
          python -I -B scripts/build_go_tools.py --root "$RUNNER_TEMP/vivary-build-tools" --typescript || exit $?
          printf '%s/vivary-build-tools/bin\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
          printf 'ESBUILD_BINARY_PATH=%s/vivary-build-tools/esbuild-0.28.2-go1.26.10\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: known workbench dependency admission
        shell: bash
        run: '"$RUNNER_TEMP/vivary-build-tools/bin/node" --test --test-name-pattern="locked|archive|SemVer|TipTap|xlsx" packages/workbench/tests/dependency-advisories.test.mjs'
      - name: install workbench dependencies
        shell: bash
        run: '"$RUNNER_TEMP/vivary-build-tools/bin/pnpm" --dir packages/workbench install --frozen-lockfile --ignore-scripts'
      - name: workbench state transport
        run: |
          pnpm --dir packages/workbench exec tsx --test tests/local-access.test.ts tests/owner-sign-in.test.ts tests/native-state.test.ts tests/native-actions.test.ts tests/desktop-host.test.ts tests/chat-scope.test.ts tests/native-chat-project.test.ts
          pnpm --dir packages/workbench exec tsx --test --test-concurrency=1 tests/local-code-agent.test.ts tests/linked-history.test.ts tests/linked-conversations.test.ts tests/linked-conversation-components.test.mjs tests/claude-session-continuity.test.mjs tests/code-session-details.test.ts tests/code-state-snapshot.test.mjs tests/codex-models.test.ts tests/codex-executor.test.mjs tests/codex-app-server.test.ts tests/codex-transcript.test.mjs tests/codex-active-state.test.mjs tests/core-message-parent.test.mjs tests/local-root-provider.test.mjs tests/native-registry-scope.test.mjs tests/codex-approval.test.ts tests/code-execution-host.test.ts tests/local-runtime-setup.test.ts tests/local-code-approval-restart.test.ts tests/local-code-cleanup-refusal.test.ts tests/code-host-lifecycle.test.ts tests/desktop-server-shutdown.test.mjs tests/managed-projects.test.mjs tests/managed-project-reconnection.test.mjs tests/creator-runner.test.ts tests/creator-shutdown.test.mjs tests/python-bytecode.test.mjs tests/project-files.test.ts tests/project-memory.test.ts tests/file-draft-state.test.ts tests/original-runtime.test.ts tests/original-runtime-shutdown.test.ts tests/original-runtime-control-shutdown.test.ts tests/project-search.test.ts tests/project-file-location.test.ts tests/project-search-state.test.ts tests/project-read.test.ts tests/project-evaluate.test.ts tests/project-evaluate-form.test.ts tests/documentation-links.test.mjs tests/project-adoption.test.ts tests/project-adoption-service.test.mjs tests/project-preview.test.ts tests/preview-isolation.test.ts
          node --test packages/desktop/tests/main.test.mjs packages/desktop/tests/original-runtime.test.mjs packages/desktop/tests/package-snapshot.test.mjs packages/desktop/tests/installer-script.test.mjs packages/desktop/tests/installer-build.test.mjs packages/workbench/tests/startup.test.mjs
          python packages/workbench/tests/managed-projects-python.test.py
          pnpm --dir packages/workbench exec react-router typegen
          "$RUNNER_TEMP/vivary-build-tools/typescript-7.0.2-go1.26.10/tsc" --noEmit --project packages/workbench/tsconfig.json
          pnpm --dir packages/workbench run doctor

