name: ci

# GitHub Actions is free for public repos, so this runs at no cost.
on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    name: tests + checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: mkdir -p sandboxes
      - name: tropo
        run: python packages/tropo/tests/test_tropo.py
      - name: ozone
        run: python packages/ozone/tests/test_ozone.py
      - name: exo
        run: python packages/exo/tests/test_exo.py
      - name: create-vivary
        run: python packages/create-vivary/tests/test_create_vivary.py
      - name: assets parity
        run: python packages/create-vivary/tests/test_assets_parity.py
      - name: tropo check (example vault, strict)
        run: python packages/tropo/tropo.py check --root packages/tropo/examples/vault
      - name: diff hygiene
        run: git diff --check

  review:
    name: graph review gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: mkdir -p sandboxes
      - name: scaffold a workspace
        run: python packages/create-vivary/create_vivary.py init sandboxes/ci-ws --preset coding --force
      - name: doctor
        run: python packages/create-vivary/create_vivary.py doctor sandboxes/ci-ws
      - name: tropo check (strict)
        run: python packages/tropo/tropo.py check --root sandboxes/ci-ws
      - name: ozone review (gate)
        run: python packages/ozone/ozone.py review --root sandboxes/ci-ws --strict

  site:
    name: site build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: install
        run: npm ci
        working-directory: site
      - name: build (re-syncs docs, then astro build)
        run: npm run build
        working-directory: site
