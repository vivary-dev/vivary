name: track-stats

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday 09:00 UTC
  workflow_dispatch:        # Also runnable manually

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2 pinned to an immutable commit SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: fetch and record
        run: python3 tools/update_stats.py

      - name: open stats update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            NPM=$(python3 -c "import json; d=json.load(open('stats/latest.json')); print(d['npm_weekly'])")
            PYPI=$(python3 -c "import json; d=json.load(open('stats/latest.json')); print(d['pypi_weekly'])")
            STARS=$(python3 -c "import json; d=json.load(open('stats/latest.json')); print(d['github_stars'])")
            BRANCH="chore/stats-$DATE"
            BODY="Automated stats snapshot.\n\n- npm weekly downloads: $NPM\n- PyPI weekly downloads: $PYPI\n- GitHub stars: $STARS"
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              BRANCH="chore/stats-$DATE-${GITHUB_RUN_ID}"
            fi
            git switch -c "$BRANCH"
            git commit -m "chore(stats): $DATE — npm/wk:$NPM pypi/wk:$PYPI ★$STARS"
            gh auth setup-git
            git push --set-upstream origin "$BRANCH"
            if gh pr view "$BRANCH" --json number --jq .number >/dev/null 2>&1; then
              gh pr edit "$BRANCH" \
                --title "chore(stats): $DATE snapshot" \
                --body "$BODY"
            else
              gh pr create \
                --base dev \
                --head "$BRANCH" \
                --title "chore(stats): $DATE snapshot" \
                --body "$BODY"
            fi
          fi
