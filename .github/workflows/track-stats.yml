name: track-stats

on:
  schedule:
    - cron: '17 9 * * *'   # Every day 09:17 UTC
  workflow_dispatch:        # Also runnable manually

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2 pinned to an immutable commit SHA.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: fetch and record
        run: python3 tools/update_stats.py

      - name: verify stats snapshot
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          latest = json.loads(Path("stats/latest.json").read_text())
          assert latest["date"], "latest snapshot needs date"
          assert latest["status"] in {"ok", "stale"}, latest["status"]
          assert latest["totals"]["npm_weekly"] > 0, latest["totals"]
          assert latest["totals"]["pypi_weekly"] > 0, latest["totals"]
          assert latest["totals"]["package_weekly"] == latest["totals"]["npm_weekly"] + latest["totals"]["pypi_weekly"]
          assert "@vivary/create" in latest["npm"]["packages"]
          for package in ["create-vivary", "vivary-tropo", "vivary-ozone", "vivary-exo"]:
              assert package in latest["pypi"]["packages"], package
          rows = list(csv.DictReader(Path("stats/history.csv").open(newline="", encoding="utf-8")))
          assert rows and rows[-1]["date"] == latest["date"], "history must include latest row"
          PY

      - name: open stats update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Self-heal: close any stats PR left open from a previous day (its data
          # is superseded by today's snapshot) and delete its branch.
          TODAY=$(date -u +%Y-%m-%d)
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("chore/stats-")) | select(.headRefName | contains("'"$TODAY"'") | not) | .number' \
            | while read -r STALE; do
              gh pr close "$STALE" --comment "Superseded by today's snapshot." --delete-branch || true
            done
          git add stats/ site/public/usage-snapshot.svg
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            NPM=$(python3 -c "import json; d=json.load(open('stats/latest.json')); print(d['npm_weekly'])")
            PYPI=$(python3 -c "import json; d=json.load(open('stats/latest.json')); print(d['pypi_weekly'])")
            PACKAGE=$(python3 -c "import json; d=json.load(open('stats/latest.json')); print(d['totals']['package_weekly'])")
            STARS=$(python3 -c "import json; d=json.load(open('stats/latest.json')); print(d['github_stars'])")
            STATUS=$(python3 -c "import json; d=json.load(open('stats/latest.json')); print(d['status'])")
            BRANCH="chore/stats-$DATE"
            BODY="Automated daily stats snapshot.\n\n- npm weekly downloads: $NPM\n- PyPI weekly downloads: $PYPI\n- all package weekly downloads: $PACKAGE\n- GitHub stars: $STARS\n- snapshot status: $STATUS"
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              BRANCH="chore/stats-$DATE-${GITHUB_RUN_ID}"
            fi
            git switch -c "$BRANCH"
            git commit -m "chore(stats): $DATE daily snapshot"
            gh auth setup-git
            git push --set-upstream origin "$BRANCH"
            if gh pr view "$BRANCH" --json number --jq .number >/dev/null 2>&1; then
              gh pr edit "$BRANCH" \
                --title "chore(stats): $DATE snapshot" \
                --body "$BODY"
            else
              gh pr create \
                --base dev \
                --head "$BRANCH" \
                --title "chore(stats): $DATE snapshot" \
                --body "$BODY"
            fi
            # Merge hands-free once the required checks pass. Requires the repo
            # settings "allow auto-merge" and "Actions can create PRs"; if either
            # is off, leave the PR open rather than failing the run.
            gh pr merge "$BRANCH" --auto --merge \
              || echo "auto-merge unavailable; PR left open for manual merge"
          fi
