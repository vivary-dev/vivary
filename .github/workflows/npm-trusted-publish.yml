name: npm trusted publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "@vivary/create version to publish; must match package.json and release_tag."
        required: true
        type: string
      release_tag:
        description: "Existing release tag to publish from, e.g. v0.3.1."
        required: true
        type: string
      publish:
        description: "Actually publish to npm. Leave false for the dry-run gate."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: "@vivary/create release checks"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - &runner_action_node_bootstrap
        name: runner action Node admission
        id: runner_action_node
        shell: python -I -B {0}
        run: |
          import types

          RUNNER_ADMISSION_SOURCE = r'''"""Pre-JavaScript runner admission, also embedded verbatim in every workflow check_ci_workflow.py admits."""

          import ctypes
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath, PureWindowsPath
          import platform
          import re
          import struct
          import subprocess
          import sys
          import threading


          # https://nodejs.org/en/blog/vulnerability/october-2026-security-releases
          # Checked by the controller on 2026-10-21. CVE-2026-111497 is a Brotli
          # out-of-bounds write / RCE on all three lines. This is known-advisory coverage,
          # not a zero-vulnerability claim or permission to select another project runtime.
          FLOORS = {22: (23, 4), 24: (22, 1), 26: (12, 1)}
          MAX_ANCESTORS = 64
          PROBE_TIMEOUT = 10
          KNOWN_SELECTION_FLAGS = {
              "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24",
              "ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION",
              "ACTIONS_RUNNER_FORCED_INTERNAL_NODE_VERSION",
          }


          def refuse(message):
              raise RuntimeError("Runner action Node: " + message)


          def node_version(value, selected_major=None):
              if not isinstance(value, str) or not re.fullmatch(r"v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", value):
                  refuse("malformed or prerelease version")
              major, minor, patch = map(int, value.removeprefix("v").split("."))
              if major not in FLOORS or (minor, patch) < FLOORS[major]:
                  refuse("EOL, unknown or advisory-affected Node release")
              if selected_major is not None and major != selected_major:
                  refuse("the action interpreter must actually be Node 24")
              return f"{major}.{minor}.{patch}"


          def check_selection_overrides(environment):
              # Examined runner dispatch leaves explicit node24 on node24 for the known
              # migration flags. Internal-function selection does not select action Node.
              for name, value in environment.items():
                  if value and "NODE" in name and name.startswith(("ACTIONS_", "FORCE_JAVASCRIPT_")) and name not in KNOWN_SELECTION_FLAGS:
                      refuse("unproved selection override " + name)  # Report names, never values.


          def check_host(system, machine, environment, container=False):
              if system not in ("linux", "win32") or machine.lower() not in ("x86_64", "amd64") or struct.calcsize("P") != 8:
                  refuse("only native Linux/Windows x64 hosts are supported")
              if environment.get("RUNNER_ARCH", "X64") != "X64" or environment.get("RUNNER_OS", {"linux": "Linux", "win32": "Windows"}[system]) != {"linux": "Linux", "win32": "Windows"}[system]:
                  refuse("runner OS/architecture disagrees with the native host")
              if container:
                  refuse("container execution is unsupported")
              check_selection_overrides(environment)


          def container_host(system):
              if any(os.environ.get(name) for name in ("CONTAINER_SANDBOX_MOUNT_POINT", "DOTNET_RUNNING_IN_CONTAINER", "DOTNET_RUNNING_IN_CONTAINERS")):
                  return True
              if system == "linux":
                  if any(Path(name).exists() for name in ("/.dockerenv", "/run/.containerenv", "/run/systemd/container")):
                      return True
                  return bool(re.search(r"docker|kubepods|containerd|lxc", Path("/proc/1/cgroup").read_text()))
              return False


          def parse_linux_stat(text):
              pid, separator, rest = text.partition(" (")
              name, closing, tail = rest.rpartition(") ")
              fields = tail.split()
              if not separator or not closing or not pid.isdecimal() or len(fields) < 20 or fields[0] in ("Z", "X"):
                  refuse("unreadable Linux process identity")
              try:
                  return {"pid": int(pid), "ppid": int(fields[1]), "created": int(fields[19])}
              except ValueError:
                  refuse("malformed Linux process identity")


          def linux_process(pid):
              folder = Path("/proc") / str(pid)
              before = parse_linux_stat((folder / "stat").read_text())
              executable = os.readlink(folder / "exe")
              after = parse_linux_stat((folder / "stat").read_text())
              if before != after or before["pid"] != pid or executable.endswith(" (deleted)") or not Path(executable).is_absolute():
                  refuse("Linux process disappeared, changed or reused its PID")
              return {**before, "exe": str(Path(executable).resolve(strict=True))}


          def windows_process(pid):
              from ctypes import wintypes
              kernel = ctypes.WinDLL("kernel32", use_last_error=True)
              ntdll = ctypes.WinDLL("ntdll")

              class BasicInformation(ctypes.Structure):
                  _fields_ = [("reserved", ctypes.c_void_p), ("peb", ctypes.c_void_p),
                              ("reserved2", ctypes.c_void_p * 2), ("pid", ctypes.c_size_t), ("parent", ctypes.c_size_t)]

              kernel.OpenProcess.argtypes = [wintypes.DWORD, wintypes.BOOL, wintypes.DWORD]
              kernel.OpenProcess.restype = wintypes.HANDLE
              kernel.CloseHandle.argtypes = [wintypes.HANDLE]
              kernel.GetProcessTimes.argtypes = [wintypes.HANDLE] + [ctypes.POINTER(wintypes.FILETIME)] * 4
              kernel.QueryFullProcessImageNameW.argtypes = [wintypes.HANDLE, wintypes.DWORD, wintypes.LPWSTR, ctypes.POINTER(wintypes.DWORD)]
              kernel.WaitForSingleObject.argtypes = [wintypes.HANDLE, wintypes.DWORD]
              kernel.WaitForSingleObject.restype = wintypes.DWORD
              ntdll.NtQueryInformationProcess.argtypes = [wintypes.HANDLE, wintypes.ULONG, ctypes.c_void_p, wintypes.ULONG, ctypes.POINTER(wintypes.ULONG)]
              ntdll.NtQueryInformationProcess.restype = wintypes.LONG
              handle = kernel.OpenProcess(0x1000 | 0x100000, False, pid)
              if not handle:
                  refuse("unreadable Windows process identity")
              try:
                  info = BasicInformation()
                  size = wintypes.ULONG()
                  if ntdll.NtQueryInformationProcess(handle, 0, ctypes.byref(info), ctypes.sizeof(info), ctypes.byref(size)) != 0:
                      refuse("Windows parent identity is unavailable")
                  times = [wintypes.FILETIME() for _ in range(4)]
                  if not kernel.GetProcessTimes(handle, *(ctypes.byref(value) for value in times)):
                      refuse("Windows creation identity is unavailable")
                  buffer = ctypes.create_unicode_buffer(32768)
                  length = wintypes.DWORD(len(buffer))
                  if not kernel.QueryFullProcessImageNameW(handle, 0, buffer, ctypes.byref(length)) or info.pid != pid or kernel.WaitForSingleObject(handle, 0) != 258:
                      refuse("Windows process disappeared or reused its PID")
                  return {"pid": pid, "ppid": int(info.parent), "created": (times[0].dwHighDateTime << 32) | times[0].dwLowDateTime, "exe": buffer.value}
              finally:
                  kernel.CloseHandle(handle)


          def discover_worker(pid, read_process, system):
              # The nearest owning Worker selects this action's interpreter. Its own
              # service ancestors are outside that execution boundary.
              chain = []
              seen = set()
              paths = PureWindowsPath if system == "win32" else PurePosixPath
              expected = "runner.worker.exe" if system == "win32" else "Runner.Worker"
              worker = None
              while pid:
                  if pid in seen or len(chain) >= MAX_ANCESTORS:
                      refuse("cyclic or overlong process ancestry")
                  seen.add(pid)
                  item = read_process(pid)
                  if item["pid"] != pid or item["created"] <= 0 or item["ppid"] < 0 or not paths(item["exe"]).is_absolute():
                      refuse("missing process identity")
                  chain.append(item)
                  if item["ppid"] in seen:
                      refuse("cyclic or overlong process ancestry")
                  name = paths(item["exe"]).name
                  if len(chain) > 1 and (name.lower() if system == "win32" else name) == expected:
                      runner_paths(item, system)
                      worker = item
                      break
                  pid = item["ppid"]
              if worker is None:
                  refuse("an owning Runner.Worker ancestor is required")
              for item in chain:
                  if read_process(item["pid"]) != item:
                      refuse("ancestry changed or reused a process identity")
              return worker, chain


          def runner_paths(worker, system):
              paths = PureWindowsPath if system == "win32" else PurePosixPath
              executable = paths(worker["exe"])
              directory = executable.parent.name.lower() if system == "win32" else executable.parent.name
              if not executable.is_absolute() or directory != "bin" or ".." in executable.parts:
                  refuse("Worker is not in the runner root's bin directory")
              root = executable.parent.parent
              node = root / "externals" / "node24" / "bin" / ("node.exe" if system == "win32" else "node")
              return str(root), str(node)


          def binary_x64(file, system):
              with open(file, "rb") as stream:
                  header = stream.read(64)
                  if system == "linux":
                      if len(header) < 20 or header[:6] != b"\x7fELF\x02\x01" or struct.unpack_from("<H", header, 18)[0] != 62:
                          refuse("expected a Linux x64 ELF executable")
                  else:
                      if len(header) != 64 or header[:2] != b"MZ":
                          refuse("expected a Windows x64 PE executable")
                      offset = struct.unpack_from("<I", header, 60)[0]
                      if not 64 <= offset <= 1024 * 1024:
                          refuse("malformed PE header")
                      stream.seek(offset)
                      pe = stream.read(26)
                      if len(pe) != 26 or pe[:4] != b"PE\0\0" or struct.unpack_from("<H", pe, 4)[0] != 0x8664 or struct.unpack_from("<H", pe, 24)[0] != 0x20b:
                          refuse("expected a Windows x64 PE32+ executable")


          def sha256(file):
              digest = hashlib.sha256()
              with open(file, "rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def sanitized_environment(system):
              environment = {"LANG": "C", "LC_ALL": "C"}
              if system == "win32":
                  kernel = ctypes.WinDLL("kernel32", use_last_error=True)
                  buffer = ctypes.create_unicode_buffer(32768)
                  length = kernel.GetWindowsDirectoryW(buffer, len(buffer))
                  if not 0 < length < len(buffer):
                      refuse("Windows directory is unavailable")
                  environment["SystemRoot"] = buffer.value
              return environment


          def probe_version(executable, environment):
              # Bound output as well as elapsed time, without running any JavaScript guard.
              process = subprocess.Popen([str(executable), "--version"], stdin=subprocess.DEVNULL,
                                         stdout=subprocess.PIPE, stderr=subprocess.STDOUT, env=environment,
                                         cwd=str(executable.parent), shell=False)
              output = []
              def read_output():
                  try:
                      output.append(process.stdout.read(129))
                  except OSError:
                      output.append(b"")
              reader = threading.Thread(target=read_output, daemon=True)
              reader.start()
              try:
                  reader.join(PROBE_TIMEOUT)
                  if reader.is_alive() or not output or len(output[0]) > 128:
                      refuse("interpreter probe timed out or exceeded its output bound")
                  try:
                      status = process.wait(timeout=2)
                  except subprocess.TimeoutExpired:
                      refuse("interpreter probe timed out")
                  if status != 0:
                      refuse("interpreter probe failed")
                  try:
                      text = output[0].decode("ascii")
                  except UnicodeDecodeError:
                      refuse("interpreter probe returned malformed output")
                  if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:\r?\n)?", text):
                      refuse("interpreter probe returned malformed output")
                  return text.rstrip("\r\n")
              finally:
                  if process.poll() is None:
                      process.kill()
                  process.wait(timeout=2)
                  reader.join(2)
                  # A failed probe may leave an inherited pipe open. Never block on a
                  # buffered close while the bounded daemon reader still owns that pipe.
                  if not reader.is_alive():
                      process.stdout.close()


          def check_runner_action_node():
              system = sys.platform
              check_host(system, platform.machine(), os.environ, container_host(system))
              if system == "win32":
                  # Refuse x64 emulation on ARM even when the Python process reports AMD64.
                  from ctypes import wintypes
                  kernel = ctypes.WinDLL("kernel32", use_last_error=True)
                  kernel.GetCurrentProcess.restype = wintypes.HANDLE
                  kernel.IsWow64Process2.argtypes = [wintypes.HANDLE, ctypes.POINTER(wintypes.USHORT), ctypes.POINTER(wintypes.USHORT)]
                  process_machine, native_machine = wintypes.USHORT(), wintypes.USHORT()
                  if not kernel.IsWow64Process2(kernel.GetCurrentProcess(), ctypes.byref(process_machine), ctypes.byref(native_machine)) or native_machine.value != 0x8664 or process_machine.value not in (0, 0x8664):
                      refuse("native Windows x64 identity is required")
              read_process = windows_process if system == "win32" else linux_process
              worker, chain = discover_worker(os.getpid(), read_process, system)
              root, selected = runner_paths(worker, system)
              interpreter = Path(selected)
              if not interpreter.is_file() or os.path.normcase(str(interpreter.resolve(strict=True))) != os.path.normcase(str(interpreter)):
                  refuse("missing interpreter or a path outside the discovered runner root")
              binary_x64(worker["exe"], system)
              binary_x64(interpreter, system)
              worker_hash, before = sha256(worker["exe"]), sha256(interpreter)
              version = node_version(probe_version(interpreter, sanitized_environment(system)), selected_major=24)
              if sha256(interpreter) != before or sha256(worker["exe"]) != worker_hash:
                  refuse("Worker or interpreter bytes changed during the probe")
              for item in chain:
                  if read_process(item["pid"]) != item:
                      refuse("Worker ancestry changed or reused a process identity")
              return {"worker": worker, "workerSha256": worker_hash, "root": root,
                      "interpreter": str(interpreter), "sha256": before, "version": version,
                      "platform": system, "architecture": "x64"}


          def admission_failure(error):
              phases = {
                  "container_host": "container-detection", "check_host": "host-policy",
                  "check_selection_overrides": "selection-policy", "parse_linux_stat": "process-stat",
                  "linux_process": "process-identity", "windows_process": "process-identity",
                  "discover_worker": "process-ancestry", "runner_paths": "runner-layout",
                  "binary_x64": "binary-identity", "sha256": "binary-hash",
                  "sanitized_environment": "probe-environment", "probe_version": "interpreter-probe",
                  "node_version": "interpreter-version",
              }
              phase = "admission"
              observed = None
              trace = error.__traceback__
              while trace is not None:
                  frame = trace.tb_frame
                  phase = phases.get(frame.f_code.co_name, phase)
                  if isinstance(error, RuntimeError) and frame.f_code is node_version.__code__:
                      value = frame.f_locals.get("value")
                      selected = frame.f_locals.get("selected_major")
                      if (type(value) is str and len(value) <= 32 and type(selected) is int and selected == 24
                              and re.fullmatch(r"v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", value)):
                          observed = value.removeprefix("v")
                  trace = trace.tb_next
              detail = f", observedNode={observed}, requiredNode=24.22.1" if observed is not None else ""
              return f"Runner action Node: admission failed (phase={phase}, exception={type(error).__name__}{detail})"


          def main():
              try:
                  print(json.dumps(check_runner_action_node(), sort_keys=True))
                  return 0
              except (RuntimeError, OSError, ValueError, TypeError, KeyError, AttributeError, subprocess.SubprocessError) as error:
                  # Report only owned labels and validated numeric versions, never raw exception text.
                  print(admission_failure(error), file=sys.stderr)
                  return 1


          if __name__ == "__main__":
              sys.exit(main())
          '''
          admission = types.ModuleType('runner_node_admission')
          exec(compile(RUNNER_ADMISSION_SOURCE, 'runner-node-admission.py', 'exec'), admission.__dict__)

          """Repair only the owning runner's known-affected action Node, then admit it.

          Runner externals are an internal compatibility dependency, not a vendor API.
          No old Node runs during repair. Unknown bytes get only the unchanged admission.
          """

          import ctypes
          import errno
          import importlib.util
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          import sys
          import tarfile
          import tempfile


          if "admission" not in globals():
              spec = importlib.util.spec_from_file_location("runner_node_admission", Path(__file__).with_name("check_runner_action_node.py"))
              admission = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(admission)

          # New bytes match official runner 2.338.1 and Node 24.22.1; the old allowlist
          # contains only Node 24.21.0 from authenticated official runner 2.338.0 archives.
          ARTIFACTS = {
              "linux": {
                  "url": "https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz",
                  "size": 32026916,
                  "sha256": "6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6",
                  "member": "node-v24.22.1-linux-x64/bin/node", "node_size": 126879696,
                  "node_sha256": "e32e2d16081cf644f88392934288086e7662529d0d43277c34f7aad2207cfafb",
                  "old_sha256": "7fde7b8afa198da66257f42ee2001d874c7355631e6d1579a5fb5ef1f246df4c",
              },
              "win32": {
                  "url": "https://nodejs.org/dist/v24.22.1/win-x64/node.exe",
                  "size": 93915464, "node_size": 93915464, "member": None,
                  "sha256": "d702daa815eabbff763c7d3808e235cf031cf2ca70211b56847bc72f51e240e5",
                  "node_sha256": "d702daa815eabbff763c7d3808e235cf031cf2ca70211b56847bc72f51e240e5",
                  "old_sha256": "ba4e6d110e8c1592a1ecd390f6b05f3da124b13871a5be62b341a07a853c6c32",
              },
          }


          class RepairRefusal(RuntimeError):
              pass


          def refuse(message):
              raise RepairRefusal("Runner Node repair: " + message)


          def filesystem_failure(operation, error):
              code = error.errno if type(error.errno) is int else 0
              windows = getattr(error, "winerror", 0)
              windows = windows if type(windows) is int else 0
              reason = "filesystem-unavailable"
              if code == errno.ETXTBSY:
                  reason = "selected-node-busy"
              elif windows in (32, 33):
                  reason = "image-sharing-lock"
              elif code in (errno.EACCES, errno.EPERM, errno.EROFS):
                  reason = "same-user-write-unavailable"
              return f"{operation}: {reason} (errno={code}, winerror={windows})"


          def native_windows():
              from ctypes import wintypes
              kernel = ctypes.WinDLL("kernel32", use_last_error=True)
              kernel.GetCurrentProcess.restype = wintypes.HANDLE
              kernel.IsWow64Process2.argtypes = [wintypes.HANDLE, ctypes.POINTER(wintypes.USHORT), ctypes.POINTER(wintypes.USHORT)]
              process_machine, native_machine = wintypes.USHORT(), wintypes.USHORT()
              if not kernel.IsWow64Process2(kernel.GetCurrentProcess(), ctypes.byref(process_machine), ctypes.byref(native_machine)) or native_machine.value != 0x8664 or process_machine.value not in (0, 0x8664):
                  refuse("native Windows x64 identity is required before repair")


          def plain(path, directory=False, role="artifact"):
              # Report only owned role/reason names and numeric filesystem evidence. The
              # unchanged admission also requires the interpreter's canonical spelling.
              if role not in ("root", "externals", "node24", "bin", "interpreter", "worker", "artifact", "stage"):
                  role = "artifact"
              try:
                  info = path.lstat()
                  attributes = getattr(info, "st_file_attributes", 0)
                  reason = None
                  if stat.S_ISLNK(info.st_mode):
                      reason = "symlink"
                  elif attributes & 0x400:
                      reason = "reparse-point"
                  elif not (stat.S_ISDIR(info.st_mode) if directory else stat.S_ISREG(info.st_mode)):
                      reason = "unexpected-type"
                  elif not directory and info.st_nlink != 1:
                      reason = "nonexclusive-file-links"
                  elif os.path.normcase(str(path.resolve(strict=True))) != os.path.normcase(str(path)):
                      reason = "canonical-spelling-mismatch"
              except OSError as error:
                  refuse(filesystem_failure("path-" + role, error))
              if reason:
                  refuse(f"plain canonical runner paths are required (role={role}, reason={reason}, "
                         f"mode={info.st_mode & 0xffff}, attributes={attributes & 0xffffffff}, links={min(info.st_nlink, 0x7fffffff)})")
              return info


          def identity(info):
              return (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_ctime_ns, info.st_mode, info.st_nlink)


          def context():
              system = sys.platform
              admission.check_host(system, admission.platform.machine(), os.environ, admission.container_host(system))
              if system == "win32":
                  native_windows()
              read = admission.windows_process if system == "win32" else admission.linux_process
              worker, chain = admission.discover_worker(os.getpid(), read, system)
              root, selected = admission.runner_paths(worker, system)
              interpreter = Path(selected)
              folders = [Path(root), interpreter.parent.parent.parent, interpreter.parent.parent, interpreter.parent]
              directories = []
              for role, path in zip(("root", "externals", "node24", "bin"), folders):
                  info = plain(path, directory=True, role=role)
                  directories.append((path, (info.st_dev, info.st_ino)))
              original = plain(interpreter, role="interpreter")
              if original.st_mode & (stat.S_ISUID | stat.S_ISGID):
                  refuse("privileged interpreter modes are not admitted")
              plain(Path(worker["exe"]), role="worker")
              admission.binary_x64(worker["exe"], system)
              admission.binary_x64(interpreter, system)
              result = {"system": system, "worker": worker, "chain": chain, "root": root,
                        "interpreter": interpreter, "directories": directories, "original": identity(original),
                        "mode": stat.S_IMODE(original.st_mode), "oldSha256": admission.sha256(interpreter),
                        "workerSha256": admission.sha256(worker["exe"])}
              verify_context(result, result["oldSha256"])
              return result


          def verify_context(current, expected_sha=None):
              system = current["system"]
              read = admission.windows_process if system == "win32" else admission.linux_process
              for item in current["chain"]:
                  if read(item["pid"]) != item:
                      refuse("Worker ancestry changed")
              if admission.runner_paths(current["worker"], system) != (current["root"], str(current["interpreter"])):
                  refuse("runner layout changed")
              if admission.sha256(current["worker"]["exe"]) != current["workerSha256"]:
                  refuse("Worker bytes changed")
              for role, (path, expected) in zip(("root", "externals", "node24", "bin"), current["directories"]):
                  info = plain(path, directory=True, role=role)
                  if (info.st_dev, info.st_ino) != expected:
                      refuse("runner directory changed")
              info = plain(current["interpreter"], role="interpreter")
              if expected_sha == current["oldSha256"] and identity(info) != current["original"]:
                  refuse("original interpreter identity changed")
              if expected_sha is not None and admission.sha256(current["interpreter"]) != expected_sha:
                  refuse("selected interpreter bytes changed")
              admission.binary_x64(current["interpreter"], system)


          def windows_node_processes():
              from ctypes import wintypes
              class Entry(ctypes.Structure):
                  _fields_ = [("dwSize", wintypes.DWORD), ("cntUsage", wintypes.DWORD), ("th32ProcessID", wintypes.DWORD),
                              ("th32DefaultHeapID", ctypes.c_size_t), ("th32ModuleID", wintypes.DWORD), ("cntThreads", wintypes.DWORD),
                              ("th32ParentProcessID", wintypes.DWORD), ("pcPriClassBase", wintypes.LONG),
                              ("dwFlags", wintypes.DWORD), ("szExeFile", wintypes.WCHAR * 260)]
              kernel = ctypes.WinDLL("kernel32", use_last_error=True)
              kernel.CreateToolhelp32Snapshot.argtypes = [wintypes.DWORD, wintypes.DWORD]
              kernel.CreateToolhelp32Snapshot.restype = wintypes.HANDLE
              kernel.Process32FirstW.argtypes = [wintypes.HANDLE, ctypes.POINTER(Entry)]
              kernel.Process32NextW.argtypes = [wintypes.HANDLE, ctypes.POINTER(Entry)]
              kernel.CloseHandle.argtypes = [wintypes.HANDLE]
              handle = kernel.CreateToolhelp32Snapshot(2, 0)
              if handle == ctypes.c_void_p(-1).value:
                  refuse("process snapshot unavailable")
              try:
                  entry = Entry()
                  entry.dwSize = ctypes.sizeof(entry)
                  if not kernel.Process32FirstW(handle, ctypes.byref(entry)):
                      refuse("process snapshot unreadable")
                  while True:
                      if entry.szExeFile.lower() == "node.exe":
                          yield int(entry.th32ProcessID)
                      if not kernel.Process32NextW(handle, ctypes.byref(entry)):
                          if ctypes.get_last_error() != 18:  # ERROR_NO_MORE_FILES
                              refuse("process snapshot incomplete")
                          break
              finally:
                  kernel.CloseHandle(handle)


          def assert_quiescent(current):
              if current["system"] == "linux":
                  info = os.fstat(current["lease"])
                  if (info.st_dev, info.st_ino) != current["original"][:2]:
                      refuse("the original Node write lease changed")
              else:
                  for pid in windows_node_processes():
                      try:
                          process = admission.windows_process(pid)
                      except (OSError, RuntimeError):
                          refuse("a potential Node process cannot be inspected")
                      if os.path.normcase(process["exe"]) == os.path.normcase(str(current["interpreter"])):
                          refuse("the selected Node is still running")


          def acquire_write_lease(current):
              # Linux refuses O_WRONLY with ETXTBSY for an executing inode. Holding this
              # non-truncating descriptor also prevents new execs of the old inode across
              # rename, for every UID, without depending on /proc visibility.
              try:
                  descriptor = os.open(current["interpreter"], os.O_WRONLY | os.O_NOFOLLOW)
              except OSError as error:
                  refuse(filesystem_failure("write-lease", error))
              try:
                  if identity(os.fstat(descriptor)) != current["original"]:
                      refuse("the original Node changed before its write lease")
              except BaseException:
                  os.close(descriptor)
                  raise
              return descriptor


          def curl_path():
              if sys.platform == "linux":
                  return "/usr/bin/curl"
              kernel = ctypes.WinDLL("kernel32", use_last_error=True)
              directory = ctypes.create_unicode_buffer(32768)
              length = kernel.GetWindowsDirectoryW(directory, len(directory))
              if not 0 < length < len(directory):
                  refuse("native Windows directory is unavailable")
              return str(Path(directory.value) / "System32/curl.exe")


          def download(artifact, path):
              # Preserve the host's existing TLS/proxy policy; discard executable injection
              # and user curl configuration without logging environment or curl diagnostics.
              keep = {"SYSTEMROOT", "WINDIR", "TEMP", "TMP", "HTTPS_PROXY", "HTTP_PROXY", "ALL_PROXY", "NO_PROXY",
                      "https_proxy", "http_proxy", "all_proxy", "no_proxy", "CURL_CA_BUNDLE", "SSL_CERT_FILE", "SSL_CERT_DIR"}
              environment = {key: value for key, value in os.environ.items() if key in keep}
              before = identity(plain(path))
              try:
                  subprocess.run([curl_path(), "--disable", "--fail", "--silent", "--show-error",
                                  "--proto", "=https", "--proto-redir", "=https", "--location", "--max-redirs", "0",
                                  "--connect-timeout", "10", "--max-time", "90", "--max-filesize", str(artifact["size"]),
                                  "--output", str(path), artifact["url"]], env=environment, stdin=subprocess.DEVNULL,
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=95, check=True)
              except subprocess.CalledProcessError as error:
                  refuse("download failed (curlReturnCode=" + str(error.returncode) + ")")
              except subprocess.TimeoutExpired:
                  refuse("download exceeded its deadline")
              after = plain(path)
              if (after.st_dev, after.st_ino) != before[:2] or after.st_size != artifact["size"] or admission.sha256(path) != artifact["sha256"]:
                  refuse("download size, identity or SHA256 mismatch")


          def stage_node(artifact, downloaded, node_dir, mode):
              if plain(downloaded).st_size != artifact["size"] or admission.sha256(downloaded) != artifact["sha256"]:
                  refuse("artifact must be authenticated before parsing")
              fd, name = tempfile.mkstemp(prefix=".vivary-node-stage-", dir=node_dir)
              staged = Path(name)
              try:
                  with os.fdopen(fd, "wb") as output:
                      if artifact["member"] is None:
                          with downloaded.open("rb") as source:
                              copy_node(source, output, artifact)
                      else:
                          with tarfile.open(downloaded, "r:xz") as archive:
                              matches = [item for item in archive if item.name == artifact["member"]]
                              if len(matches) != 1 or not matches[0].isreg() or matches[0].size != artifact["node_size"]:
                                  refuse("one exact regular Node archive member is required")
                              with archive.extractfile(matches[0]) as source:
                                  copy_node(source, output, artifact)
                      output.flush()
                      os.fsync(output.fileno())
                  os.chmod(staged, mode & 0o777)
                  if admission.sha256(staged) != artifact["node_sha256"]:
                      refuse("staged Node SHA256 mismatch")
                  admission.binary_x64(staged, sys.platform)
                  plain(staged, role="stage")
                  return staged
              except BaseException:
                  staged.unlink(missing_ok=True)
                  raise


          def copy_node(source, output, artifact):
              total = 0
              while True:
                  chunk = source.read(min(65536, artifact["node_size"] + 1 - total))
                  if not chunk:
                      break
                  total += len(chunk)
                  if total > artifact["node_size"]:
                      refuse("Node member exceeded its exact byte bound")
                  output.write(chunk)
              if total != artifact["node_size"]:
                  refuse("Node member is incomplete")


          def repair_runner_action_node():
              current = context()
              artifact = ARTIFACTS[current["system"]]
              outcome = "already-qualified"
              staged = None
              lease = None
              try:
                  if current["oldSha256"] not in (artifact["node_sha256"], artifact["old_sha256"]):
                      # Preserve future patched workers without blindly downgrading unknown bytes.
                      outcome = "admitted-unmodified"
                  elif current["oldSha256"] == artifact["old_sha256"]:
                      if current["system"] == "linux":
                          lease = current["lease"] = acquire_write_lease(current)
                      assert_quiescent(current)
                      with tempfile.TemporaryDirectory(prefix="vivary-runner-node-") as directory:
                          # Windows TEMP may use a short alias. Resolve only this newly
                          # owned temporary root; runner paths retain their custody checks.
                          downloaded = Path(directory).resolve(strict=True) / "artifact"
                          with downloaded.open("xb"):
                              pass
                          downloaded.chmod(0o600)
                          download(artifact, downloaded)
                          staged = stage_node(artifact, downloaded, current["interpreter"].parent, current["mode"])
                          staged_identity = identity(plain(staged, role="stage"))
                          verify_context(current, current["oldSha256"])
                          assert_quiescent(current)
                          if identity(plain(staged, role="stage")) != staged_identity or admission.sha256(staged) != artifact["node_sha256"]:
                              refuse("staged interpreter changed before replacement")
                          verify_context(current, current["oldSha256"])
                          try:
                              os.replace(staged, current["interpreter"])
                          except OSError as error:
                              refuse(filesystem_failure("atomic-replacement", error))
                          staged = None
                          verify_context(current, artifact["node_sha256"])
                          assert_quiescent(current)
                          outcome = "repaired"
                  # Full, unchanged admission independently rediscovers and probes this same Node.
                  result = admission.check_runner_action_node()
                  result["repair"] = {"outcome": outcome, "previousSha256": current["oldSha256"],
                                      "artifact": artifact["url"] if outcome == "repaired" else None,
                                      "artifactSha256": artifact["sha256"] if outcome == "repaired" else None}
                  return result
              finally:
                  if staged is not None:
                      staged.unlink(missing_ok=True)
                  if lease is not None:
                      os.close(lease)


          def main():
              try:
                  if len(sys.argv) != 1:
                      refuse("arguments and caller-supplied runtime facts are not admitted")
                  print(json.dumps(repair_runner_action_node(), sort_keys=True))
                  return 0
              except (RuntimeError, OSError, ValueError, TypeError, KeyError, AttributeError, tarfile.TarError, subprocess.SubprocessError) as error:
                  if type(error) is RepairRefusal:
                      message = str(error)
                  elif isinstance(error, RuntimeError):
                      message = admission.admission_failure(error)
                  elif isinstance(error, OSError):
                      message = "Runner Node repair: " + filesystem_failure("filesystem", error)
                  else:
                      message = "Runner Node repair: refused (exception=" + type(error).__name__ + ")"
                  print(message, file=sys.stderr)
                  return 1


          if __name__ == "__main__":
              sys.exit(main())
      - name: Checkout release tag
        # actions/checkout v7.0.1 pinned to an immutable commit SHA.
        # The release tag supplies the CI Python bootstrap and admission scripts
        # run below. A tag cut from a commit without them fails before publication.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.15"
      - name: verified Python runtime provisioning
        shell: python -I -B {0}
        run: |
          import runpy
          runpy.run_path("scripts/bootstrap_ci_python.py", run_name="__main__")
      - name: actual Python runtime admission
        shell: python -I -B {0}
        run: |
          import runpy
          runpy.run_path("scripts/check_python_runtime.py", run_name="__main__")

      - name: Set up Node for npm trusted publishing
        # actions/setup-node v7.0.0 pinned to an immutable commit SHA.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Verify trusted publishing runtime
        shell: bash
        run: |
          set -euo pipefail
          node packages/workbench/bin/runtime-security.mjs
          node --version

      - name: qualified npm client
        # Every npm command in this job runs this client, as in ci.yml.
        shell: bash
        run: |
          set -euo pipefail
          python -I -B scripts/bootstrap_build_tools.py --root "$RUNNER_TEMP/vivary-build-tools"
          test "$("$RUNNER_TEMP/vivary-build-tools/bin/npm" --version)" = "12.2.1"

      - name: Verify release tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.release_tag }}" = "v${{ inputs.version }}"
          test "$(git rev-parse "refs/tags/${{ inputs.release_tag }}^{commit}")" = "$(git rev-parse HEAD)"
          test "$(node -p "require('./packages/create-vivary/npm/package.json').version")" = "${{ inputs.version }}"
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          npm_version = json.loads(
              Path("packages/create-vivary/npm/package.json").read_text(encoding="utf-8")
          )["version"]
          pyproject = Path("packages/create-vivary/pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.MULTILINE)
          if not match:
              raise SystemExit("missing create-vivary pyproject version")
          pypi_version = match.group(1)
          if pypi_version != npm_version:
              raise SystemExit(
                  f"create-vivary version mismatch: pyproject={pypi_version} npm={npm_version}"
              )
          PY

      - name: Run create-vivary release checks
        run: |
          python packages/create-vivary/tests/test_create_vivary.py
          python packages/create-vivary/tests/test_init_thin.py
          python packages/create-vivary/tests/test_record_workflow.py
          python packages/create-vivary/tests/test_adopt.py
          python packages/create-vivary/tests/test_assets_parity.py
          node packages/create-vivary/tests/test_npm_launcher.js

      - name: Verify npm package contents
        working-directory: packages/create-vivary/npm
        run: |
          mkdir -p "$RUNNER_TEMP/npm-candidate"
          "$RUNNER_TEMP/vivary-build-tools/bin/npm" pack --pack-destination "$RUNNER_TEMP/npm-candidate"
          python ../../../scripts/check_release_artifacts.py --repository ../../.. --artifacts "$RUNNER_TEMP/npm-candidate" --scope npm

      - name: Stop before publish unless explicitly enabled
        if: ${{ !inputs.publish }}
        run: echo "Dry run complete. Re-run with publish=true only after the npm publish gate is approved."

  publish:
    name: "@vivary/create trusted publish"
    if: ${{ inputs.publish && needs.verify.result == 'success' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - *runner_action_node_bootstrap
      - name: Checkout release tag
        # actions/checkout v7.0.1 pinned to an immutable commit SHA.
        # The release tag supplies the CI Python bootstrap and admission scripts
        # run below. A tag cut from a commit without them fails before publication.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.15"
      - name: verified Python runtime provisioning
        shell: python -I -B {0}
        run: |
          import runpy
          runpy.run_path("scripts/bootstrap_ci_python.py", run_name="__main__")
      - name: actual Python runtime admission
        shell: python -I -B {0}
        run: |
          import runpy
          runpy.run_path("scripts/check_python_runtime.py", run_name="__main__")

      - name: Set up Node for npm trusted publishing
        # actions/setup-node v7.0.0 pinned to an immutable commit SHA.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Verify trusted publishing runtime
        shell: bash
        run: |
          set -euo pipefail
          node packages/workbench/bin/runtime-security.mjs
          node --version

      - name: qualified npm client
        # Every npm command in this job runs this client, as in ci.yml.
        shell: bash
        run: |
          set -euo pipefail
          python -I -B scripts/bootstrap_build_tools.py --root "$RUNNER_TEMP/vivary-build-tools"
          test "$("$RUNNER_TEMP/vivary-build-tools/bin/npm" --version)" = "12.2.1"

      - name: Re-verify release tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.release_tag }}" = "v${{ inputs.version }}"
          test "$(git rev-parse "refs/tags/${{ inputs.release_tag }}^{commit}")" = "$(git rev-parse HEAD)"
          test "$(node -p "require('./packages/create-vivary/npm/package.json').version")" = "${{ inputs.version }}"
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          npm_version = json.loads(
              Path("packages/create-vivary/npm/package.json").read_text(encoding="utf-8")
          )["version"]
          pyproject = Path("packages/create-vivary/pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.MULTILINE)
          if not match:
              raise SystemExit("missing create-vivary pyproject version")
          pypi_version = match.group(1)
          if pypi_version != npm_version:
              raise SystemExit(
                  f"create-vivary version mismatch: pyproject={pypi_version} npm={npm_version}"
              )
          PY

      - name: Re-verify npm package contents
        working-directory: packages/create-vivary/npm
        run: |
          mkdir -p "$RUNNER_TEMP/npm-candidate"
          "$RUNNER_TEMP/vivary-build-tools/bin/npm" pack --pack-destination "$RUNNER_TEMP/npm-candidate"
          python ../../../scripts/check_release_artifacts.py --repository ../../.. --artifacts "$RUNNER_TEMP/npm-candidate" --scope npm

      - name: Publish @vivary/create with npm trusted publishing
        run: '"$RUNNER_TEMP/vivary-build-tools/bin/node" packages/workbench/bin/runtime-security.mjs publish-npm "$RUNNER_TEMP/npm-candidate" "$RUNNER_TEMP/vivary-build-tools"'
