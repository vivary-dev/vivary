version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "automated-current"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "automated-current"
    groups:
      site-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      site-security:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/packages/create-vivary"
      - "/packages/tropo"
      - "/packages/ozone"
      - "/packages/exo"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    versioning-strategy: "increase-if-necessary"
    labels:
      - "dependencies"
      - "automated-current"
    groups:
      python-minor-patch:
        group-by: "dependency-name"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-security:
        applies-to: "security-updates"
        patterns: ["*"]
