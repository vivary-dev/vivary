<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">Vivary health check terminal proof</title>
  <desc id="desc">A generic terminal capture showing doctor and tropo check passing.</desc>
  <rect width="1040" height="420" rx="16" fill="#101c22"/>
  <rect x="1" y="1" width="1038" height="418" rx="15" fill="none" stroke="#7fbfa9" stroke-opacity="0.25"/>
  <circle cx="34" cy="34" r="6" fill="#ff6b6b"/>
  <circle cx="56" cy="34" r="6" fill="#ffd166"/>
  <circle cx="78" cy="34" r="6" fill="#63d297"/>
  <text x="28" y="78" fill="#8ee7c4" font-family="Consolas, 'JetBrains Mono', monospace" font-size="20">$ create-vivary doctor demo-vivary-workspace</text>
  <text x="28" y="126" fill="#e8fff7" font-family="Consolas, 'JetBrains Mono', monospace" font-size="20">create-vivary doctor: ok (9 node(s), 28 edge(s), 0 broken)</text>
  <text x="28" y="168" fill="#a9c9d0" font-family="Consolas, 'JetBrains Mono', monospace" font-size="20">memory: disabled (none)</text>
  <text x="28" y="238" fill="#8ee7c4" font-family="Consolas, 'JetBrains Mono', monospace" font-size="20">$ tropo check --root demo-vivary-workspace</text>
  <text x="28" y="286" fill="#e8fff7" font-family="Consolas, 'JetBrains Mono', monospace" font-size="20">tropo: 9 document(s), 0 error(s), 0 warning(s)</text>
  <text x="28" y="346" fill="#8ee7c4" font-family="Consolas, 'JetBrains Mono', monospace" font-size="20">Healthy before real work begins.</text>
</svg>
